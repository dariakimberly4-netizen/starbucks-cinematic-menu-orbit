<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#03160f"><title>Cinematic Menu Orbit</title><style>
:root{--gold:#f0c76d;--deep:#03160f;--green:#063b29}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03160f;color:#fff;font-family:Arial,sans-serif}button{font:inherit}.app{height:100%;background:radial-gradient(circle at 50% 45%,#0c563c 0,#073524 33%,#031b12 65%,#020b08 100%);position:relative;overflow:hidden}.app:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 8% 65%,rgba(180,132,56,.18),transparent 22%),radial-gradient(circle at 92% 70%,rgba(180,132,56,.14),transparent 23%);pointer-events:none}.top{height:76px;display:flex;align-items:center;padding:10px 4vw;position:relative;z-index:30;background:linear-gradient(90deg,rgba(1,16,11,.94),rgba(3,35,24,.87));border-bottom:1px solid rgba(240,199,109,.22)}.logo{width:48px;height:48px;border:2px solid white;border-radius:50%;display:grid;place-items:center;background:#00754a;font:900 25px Georgia;margin-right:12px}.brand b{letter-spacing:.1em;font-size:17px}.brand small{display:block;letter-spacing:.28em;font-size:7px;margin-top:4px}.nav{margin-left:auto;display:flex;align-items:center;gap:26px}.nav button{border:0;background:none;color:#fff;font-weight:800;font-size:11px}.nav .active{padding-bottom:7px;border-bottom:2px solid var(--gold)}.round{width:38px;height:38px;border-radius:50%;border:1px solid rgba(240,199,109,.45)!important;font-size:17px!important}.stage{position:absolute;inset:76px 0 0}.ring{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);border-radius:50%;border:1.5px solid rgba(240,199,109,.78);box-shadow:0 0 16px rgba(240,199,109,.15),inset 0 0 24px rgba(240,199,109,.05)}.r1{width:min(88vw,760px);aspect-ratio:1}.r2{width:min(65vw,560px);aspect-ratio:1;border-color:rgba(240,199,109,.48)}.r3{width:min(43vw,370px);aspect-ratio:1;border-color:rgba(240,199,109,.34)}.cat{--s:clamp(88px,18vw,140px);position:absolute;left:50%;top:48%;width:var(--s);height:var(--s);border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 45% 25%,#165a40,#063624 66%,#031b12);color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9;box-shadow:0 0 22px rgba(240,199,109,.19),0 18px 34px rgba(0,0,0,.42);padding:7px}.cat .art{font-size:clamp(34px,7vw,58px);line-height:1}.cat b{font-size:clamp(9px,1.8vw,13px);margin-top:7px}.c0{transform:translate(-50%,-50%) translateY(-42vw)}.c1{transform:translate(-50%,-50%) translate(37vw,-21vw)}.c2{transform:translate(-50%,-50%) translate(37vw,21vw)}.c3{transform:translate(-50%,-50%) translateY(42vw)}.c4{transform:translate(-50%,-50%) translate(-37vw,21vw)}.c5{transform:translate(-50%,-50%) translate(-37vw,-21vw)}.sat{--s:clamp(48px,10vw,72px);position:absolute;left:50%;top:48%;width:var(--s);height:var(--s);border-radius:50%;border:1px solid rgba(240,199,109,.7);background:#073c2a;display:grid;place-items:center;font-size:clamp(22px,5vw,38px);z-index:7}.s0{transform:translate(-50%,-50%) translateY(-24vw)}.s1{transform:translate(-50%,-50%) translate(21vw,-12vw)}.s2{transform:translate(-50%,-50%) translate(21vw,12vw)}.s3{transform:translate(-50%,-50%) translateY(24vw)}.s4{transform:translate(-50%,-50%) translate(-21vw,12vw)}.s5{transform:translate(-50%,-50%) translate(-21vw,-12vw)}.hero{--s:clamp(210px,42vw,330px);position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);width:var(--s);height:var(--s);border-radius:50%;z-index:12;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.hero:before{content:"";position:absolute;inset:4%;border-radius:50%;background:radial-gradient(circle,#0d5c40,#073624 65%,#041d14);box-shadow:0 0 55px rgba(240,199,109,.2)}.cup{position:relative;z-index:2;font-size:clamp(72px,14vw,118px);line-height:.8;filter:drop-shadow(0 14px 9px rgba(0,0,0,.4))}.hero h1{position:relative;z-index:2;font:700 clamp(18px,3vw,27px) Georgia;margin:12px 0 3px}.hero p{position:relative;z-index:2;margin:0;max-width:215px;font-size:clamp(9px,1.6vw,12px);line-height:1.3;color:#e9eee9}.price{position:relative;z-index:2;color:var(--gold);font-weight:900;margin-top:7px}.add{position:relative;z-index:2;margin-top:9px;min-height:40px;padding:0 24px;border-radius:999px;border:2px solid var(--gold);background:#063a28;color:white;font-weight:900}.arrow{position:absolute;top:48%;z-index:16;width:45px;height:45px;border-radius:50%;border:2px solid var(--gold);background:#063a28;color:white;font-size:28px}.prev{left:13%}.next{right:13%}.footer{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);z-index:20;font-size:8px;letter-spacing:.28em;white-space:nowrap}
@media(max-width:600px){.top{height:64px;padding:7px 10px}.stage{inset:64px 0 0}.logo{width:43px;height:43px;font-size:22px;margin-right:8px}.brand b{font-size:13px}.brand small{font-size:5.5px}.nav{gap:5px}.nav button:not(.round):not(.active){display:none}.nav .active{font-size:9px;padding:8px;border:1px solid rgba(240,199,109,.45);border-radius:999px}.round{width:34px;height:34px}.ring,.cat,.sat,.hero,.arrow{top:45%}.r1{width:91vw}.r2{width:68vw}.r3{width:45vw}.cat{--s:21vw;min-width:76px;min-height:76px}.cat .art{font-size:29px}.cat b{font-size:8px}.c0{transform:translate(-50%,-50%) translateY(-42vw)}.c1{transform:translate(-50%,-50%) translate(37vw,-22vw)}.c2{transform:translate(-50%,-50%) translate(37vw,22vw)}.c3{transform:translate(-50%,-50%) translateY(42vw)}.c4{transform:translate(-50%,-50%) translate(-37vw,22vw)}.c5{transform:translate(-50%,-50%) translate(-37vw,-22vw)}.sat{--s:48px;font-size:23px}.s0{transform:translate(-50%,-50%) translateY(-25vw)}.s1{transform:translate(-50%,-50%) translate(22vw,-13vw)}.s2{transform:translate(-50%,-50%) translate(22vw,13vw)}.s3{transform:translate(-50%,-50%) translateY(25vw)}.s4{transform:translate(-50%,-50%) translate(-22vw,13vw)}.s5{transform:translate(-50%,-50%) translate(-22vw,-13vw)}.hero{--s:51vw;min-width:190px;min-height:190px}.cup{font-size:62px}.hero h1{font-size:18px;margin-top:8px}.hero p{font-size:9px;max-width:155px}.price{font-size:13px}.add{min-height:35px;padding:0 16px;font-size:11px}.arrow{width:35px;height:35px;font-size:22px}.prev{left:7%}.next{right:7%}.footer{font-size:6.5px}}
@media(min-width:700px){.c0{transform:translate(-50%,-50%) translateY(-305px)}.c1{transform:translate(-50%,-50%) translate(265px,-155px)}.c2{transform:translate(-50%,-50%) translate(265px,155px)}.c3{transform:translate(-50%,-50%) translateY(305px)}.c4{transform:translate(-50%,-50%) translate(-265px,155px)}.c5{transform:translate(-50%,-50%) translate(-265px,-155px)}.s0{transform:translate(-50%,-50%) translateY(-175px)}.s1{transform:translate(-50%,-50%) translate(152px,-88px)}.s2{transform:translate(-50%,-50%) translate(152px,88px)}.s3{transform:translate(-50%,-50%) translateY(175px)}.s4{transform:translate(-50%,-50%) translate(-152px,88px)}.s5{transform:translate(-50%,-50%) translate(-152px,-88px)}}@media(max-height:690px){.stage{transform:scale(.88);transform-origin:50% 42%}.footer{display:none}}
</style></head><body><div class="app"><header class="top"><div class="logo">S</div><div class="brand"><b>STARBUCKS®</b><small>PHILIPPINES</small></div><nav class="nav"><button>HOME</button><button>OUR STORY</button><button class="active">MENU</button><button class="round">⌕</button><button class="round">◎</button><button class="round" id="cart">🛒</button></nav></header><main class="stage" id="stage"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><button class="cat c0" data-k="espresso"><span class="art">☕</span><b>ESPRESSO</b></button><button class="cat c1" data-k="refreshers"><span class="art">🍓</span><b>REFRESHERS®</b></button><button class="cat c2" data-k="food"><span class="art">🥐</span><b>FOOD</b></button><button class="cat c3" data-k="featured"><span class="art">★</span><b>FEATURED</b></button><button class="cat c4" data-k="teavana"><span class="art">🍵</span><b>TEAVANA™</b></button><button class="cat c5" data-k="frappuccino"><span class="art">🥤</span><b>FRAPPUCCINO®</b></button><div class="sat s0">☕</div><div class="sat s1">🥤</div><div class="sat s2">☕</div><div class="sat s3">🥛</div><div class="sat s4">☕</div><div class="sat s5">🥤</div><button class="arrow prev" id="prev">‹</button><button class="arrow next" id="next">›</button><section class="hero"><div class="cup" id="cup">🥤</div><h1 id="name">Caramel Macchiato</h1><p id="desc">Espresso, vanilla and steamed milk with a caramel drizzle.</p><div class="price" id="price">₱180 – ₱205</div><button class="add" id="add">Add to Order　＋</button></section></main><div class="footer">⌃　EXPLORE THE MENU</div></div><script>
const data={espresso:['☕','Caramel Macchiato','Espresso, vanilla and steamed milk with a caramel drizzle.','₱180 – ₱205'],refreshers:['🍓','Strawberry Refresher','Bright fruit flavor served chilled over ice.','₱160 – ₱190'],food:['🥐','Butter Croissant','Flaky, buttery pastry made for coffee.','₱125'],featured:['★','Featured Seasonal Drink','A rotating seasonal highlight.','₱190 – ₱220'],teavana:['🍵','Green Tea Latte','Smooth green tea with milk, hot or iced.','₱170 – ₱200'],frappuccino:['🥤','Caramel Frappuccino®','Blended coffee, milk, ice and caramel with whipped cream.','₱185 – ₱215']};const cats=[...document.querySelectorAll('.cat')];let i=0,count=0;function show(k){const v=data[k];cup.textContent=v[0];name.textContent=v[1];desc.textContent=v[2];price.textContent=v[3];i=cats.findIndex(x=>x.dataset.k===k)}cats.forEach(x=>x.onclick=()=>show(x.dataset.k));function step(d){i=(i+d+cats.length)%cats.length;show(cats[i].dataset.k)}prev.onclick=()=>step(-1);next.onclick=()=>step(1);add.onclick=()=>{count++;cart.textContent='🛒 '+count;add.textContent='Added ✓';setTimeout(()=>add.textContent='Add to Order　＋',700)};let sx=0;stage.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});stage.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)step(dx<0?1:-1)},{passive:true});
</script></body></html>
